version: 2

sources:
  - name: classic_models
    database: sandbox
    schema: classic_models
    tables:
      - name: customers
      - name: employees
      - name: offices
      - name: orders
      - name: order_details
      - name: payments
      - name: products
      - name: product_lines
      
  - name: date_spine
    description: >
      Raw date series generated by dbt_utils.date_spine covering 2003-01-01
      through 2006-12-31 at daily grain. Materialized as a table and used
      exclusively as the source for dim_date.
    columns:
      - name: date_day
        description: One row per calendar day across the spine range.
        tests:
          - unique
          - not_null