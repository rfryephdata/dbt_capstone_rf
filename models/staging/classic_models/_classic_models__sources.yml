version: 2

sources:
  - name: classic_models
    database: sandbox
    schema: classic_models
    tables:
      - name: customers
        columns:
          - name: customer_number
            tests:
              - unique
              - not_null
          - name: sales_rep_employee_number
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('classic_models', 'employees')
                    field: employee_number

      - name: employees
        columns:
          - name: employee_number
            tests:
              - unique
              - not_null
          - name: office_code
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('classic_models', 'offices')
                    field: office_code

      - name: offices
        columns:
          - name: office_code
            tests:
              - unique
              - not_null

      - name: order_details
        columns:
          - name: order_number
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('classic_models', 'orders')
                    field: order_number
          - name: product_code
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('classic_models', 'products')
                    field: product_code

      - name: orders
        columns:
          - name: order_number
            tests:
              - unique
              - not_null
          - name: customer_number
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('classic_models', 'customers')
                    field: customer_number

      - name: payments
        columns:
          - name: check_number
            tests:
              - unique
              - not_null
          - name: customer_number
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('classic_models', 'customers')
                    field: customer_number

      - name: product_lines
        columns:
          - name: product_line
            tests:
              - unique
              - not_null

      - name: products
        columns:
          - name: product_code
            tests:
              - unique
              - not_null
          - name: product_line
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('classic_models', 'product_lines')
                    field: product_line

models:
  - name: date_spine
    description: >
      Raw date series generated by dbt_utils.date_spine covering 2003-01-01
      through 2006-12-31 at daily grain. Materialized as a table and used
      exclusively as the source for dim_date.
    columns:
      - name: date_day
        description: One row per calendar day across the spine range.
        tests:
          - unique
          - not_null